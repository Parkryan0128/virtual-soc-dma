name: Virtual SoC validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build from clean Linux container and run device/firmware tests
        run: ./scripts/test-in-container.sh
      - name: Retain test summaries, UART logs and model traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-evidence
          path: artifacts/
          if-no-files-found: warn
